<!doctype html>
<html lang="zh-CN" data-theme="base">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>魔法画框 · FrameShift</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310131b'/%3E%3Cpath d='M32 8 8 32l24 24 24-24z' fill='none' stroke='%23ff6379' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2373f7d2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css?v=20260814-3" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <h1><span data-i18n="brandName">魔法画框</span><span class="brand-english">FrameShift</span></h1>
        </div>
        <div class="topbar-actions">
          <div class="locale-switcher" id="locale-buttons" role="group" aria-label="语言">
            <span class="sr-only" data-i18n="language.label">语言</span>
            <button class="locale-button" type="button" data-locale="zh-CN" aria-pressed="true" aria-label="简体中文" title="简体中文">简</button>
            <button class="locale-button" type="button" data-locale="zh-TW" aria-pressed="false" aria-label="繁體中文" title="繁體中文">繁</button>
            <button class="locale-button" type="button" data-locale="en" aria-pressed="false" aria-label="English" title="English">EN</button>
          </div>
          <button class="help-button" id="help-button" type="button" aria-haspopup="dialog" aria-controls="help-dialog" aria-label="使用帮助" title="使用帮助">?</button>
          <button class="fullscreen-button" id="fullscreen-button" type="button" aria-pressed="false" aria-label="进入全屏" title="进入全屏">
            <span class="fullscreen-icon" aria-hidden="true"></span>
            <span id="fullscreen-label" data-i18n="controls.fullscreen">全屏</span>
          </button>
        </div>
      </header>

      <section class="stage-card" data-i18n-attr="aria-label:document.stageLabel" aria-label="实时画面">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="face-canvas" aria-hidden="true"></canvas>
        <canvas id="canvas"></canvas>
        <div class="stage-status" id="stage-status">
          <span class="spinner" aria-hidden="true"></span>
          <strong id="status-title" data-i18n="status.loadingTitle">正在准备画面…</strong>
          <p id="status-detail" data-i18n="status.loadingDetail">第一次打开可能需要几秒。</p>
          <div class="loading-meter hidden" id="loading-meter">
            <div
              class="loading-progress"
              id="loading-progress"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              data-i18n-attr="aria-label:status.loadingProgressLabel"
              aria-label="加载进度"
            >
              <span id="loading-progress-bar"></span>
            </div>
            <span class="loading-progress-value" id="loading-progress-value">0%</span>
          </div>
          <button class="secondary-button hidden" id="retry-button" data-i18n="status.retry" type="button">重新尝试</button>
        </div>
        <div class="effect-toast" id="effect-toast" aria-live="polite"></div>
        <div class="capture-countdown" id="capture-countdown" aria-live="assertive" aria-hidden="true"></div>
      </section>

      <div class="control-actions stage-actions" data-i18n-attr="aria-label:controls.actions">
        <button class="secondary-button capture-button" id="capture-button" data-i18n="controls.capture" type="button">3 秒后保存</button>
        <a class="secondary-button" id="mode-toggle-button" data-mode-toggle data-i18n="controls.enableCamera" href="?lang=zh-CN">启用摄像头</a>
      </div>

      <section class="controls" data-i18n-attr="aria-label:controls.effects" aria-label="选择效果">
        <div class="effect-picker">
          <p class="section-label" data-i18n="controls.effects">选择效果</p>
          <div class="toolbar" id="toolbar"></div>
          <div class="gesture-settings" data-i18n-attr="aria-label:controls.gestureSettings" aria-label="捏合设置">
            <div class="gesture-settings-heading">
              <p class="section-label" data-i18n="controls.gestureControl">怎么玩？</p>
              <p class="control-note" data-i18n="controls.gestureNote">双手捏合切换，也可以直接点击</p>
            </div>
            <label class="toggle-control">
              <input id="pinch-toggle" type="checkbox" checked />
              <span data-i18n="controls.pinchEnabled">捏合切换</span>
            </label>
            <div class="pinch-category-controls" id="pinch-category-controls"></div>
          </div>
        </div>
      </section>

      <div class="help-dialog" id="help-dialog" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="help-title">
        <button class="help-dialog-scrim" type="button" data-help-close aria-label="关闭帮助"></button>
        <div class="help-dialog-panel">
          <div class="help-dialog-header">
            <h2 id="help-title">怎么玩？</h2>
            <button class="help-close-button" id="help-close-button" type="button" aria-label="关闭帮助">×</button>
          </div>
          <img id="help-image" class="help-image" src="assets/help/frameshift-help-a.png" alt="双手框住画面，再捏合切换效果的示意图" />
          <div class="help-steps">
            <div class="help-step">
              <span class="help-step-number">1</span>
              <div><strong id="help-step-1-label">框住画面</strong><p id="help-step-1-detail">食指在上，拇指在下。</p></div>
            </div>
            <div class="help-step">
              <span class="help-step-number">2</span>
              <div><strong id="help-step-2-label">捏合换效果</strong><p id="help-step-2-detail">两只手同时捏合。</p></div>
            </div>
          </div>
          <button class="help-start-button" id="help-start-button" type="button">开始体验</button>
        </div>
      </div>
    </main>
    <script type="module" src="main.js?v=20260814-1"></script>
  </body>
</html>
